apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  selector:
    matchLabels:
      app: backend
  replicas: 1
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
      - name: gitlab-registry
      containers:
      - name: backend
        image: registry.granux.fr/decourt-demaria/tp/backend:latest
        env:
          - name: DB_HOST
            value: pg # nom du Service défini dans pg.yaml
          - name: DB_PORT
            value: "5432"
          - name: DB_USER
            value: postgres
          - name: DB_PASSWORD
            value: postgres
          - name: DB_NAME
            value: todos
          - name: DB_SSLMODE
            value: disable
        ports:
          - name: http
            containerPort: 8080
          - name: health
            containerPort: 9090
        # Probes appelées par le kubelet directement sur le pod : pas besoin d'exposer 9090 dans le Service
        readinessProbe:
          # /readyz teste la base : tant qu'il échoue, le Service n'envoie pas de trafic au pod
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 5
        livenessProbe:
          # /healthz teste seulement que le process répond : s'il échoue, le pod est redémarré
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 5
---
kind: Service
apiVersion: v1
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
