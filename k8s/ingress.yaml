# Hosts au format imposé par le cours : <group>-*.k8s.granux.fr
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backend-ingress
spec:
  rules:
  - host: decourt-demaria-backend.k8s.granux.fr
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: backend-service
              port:
                number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
spec:
  rules:
  - host: decourt-demaria-frontend.k8s.granux.fr
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: frontend
              port:
                number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swagger-ingress
spec:
  rules:
  - host: decourt-demaria-swagger.k8s.granux.fr
    http:
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              name: swagger
              port:
                number: 8080
