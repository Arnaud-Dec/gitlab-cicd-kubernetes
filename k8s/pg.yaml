apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg
spec:
  selector:
    matchLabels:
      app: pg
  replicas: 1
  template:
    metadata:
      labels:
        app: pg
    spec:
      containers:
        - name: pg
          image: postgres:16
          # Doivent correspondre aux DB_* de backend.yaml (utilisateur par défaut : postgres)
          env:
            - name: POSTGRES_PASSWORD # obligatoire : sans lui, le conteneur refuse de démarrer
              value: postgres
            - name: POSTGRES_DB
              value: todos
          ports:
            - containerPort: 5432
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
kind: Service
apiVersion: v1
metadata:
  name: pg
spec:
  selector:
    app: pg
  ports:
    - protocol: TCP
      port: 5432

