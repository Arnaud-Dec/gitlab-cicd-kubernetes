apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  replicas: 1
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
      - name: frontend
        image: registry.granux.fr/decourt-demaria/tp/frontend:latest
        volumeMounts:
          - name: config
            mountPath: /usr/share/nginx/html/config.json
            subPath: config.json
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: 100Mi
            cpu: 100m
          limits:
            memory: 100Mi     # = request : le cours le conseille, la mémoire se partage mal
            cpu: 500m         # plus haut que la request, pour absorber le démarrage
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 3
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 3
      volumes:
        - name: config
          configMap:
            name: frontend-config
---
kind: Service
apiVersion: v1
metadata:
    name: frontend
spec:
  selector:
    app: frontend
  ports:
    - port: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
data:
  config.json: |
    {"apiUrl":"https://decourt-demaria-backend.k8s.granux.fr/api"}
    
