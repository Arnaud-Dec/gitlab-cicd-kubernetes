apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Release.Name}}-frontend
spec:
  selector:
    matchLabels:
      app: {{.Release.Name}}-frontend
  replicas: {{.Values.frontend.replicas}}
  template:
    metadata:
      labels:
        app: {{.Release.Name}}-frontend
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: frontend
          image: "{{.Values.frontend.image}}:{{.Values.frontend.imageTag}}"
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 100Mi     # imposé par le sujet
              cpu: 100m
            limits:
              memory: 100Mi     # = request : le cours le conseille, la mémoire se partage mal
              cpu: 500m         # plus haut que la request, pour absorber le démarrage
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 3
      volumes:
        - name: config
          configMap:
            name: {{.Release.Name}}-frontend-config
---
kind: Service
apiVersion: v1
metadata:
  name: {{.Release.Name}}-frontend
spec:
  selector:
    app: {{.Release.Name}}-frontend
  ports:
    - port: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{.Release.Name}}-frontend-config
data:
  config.json: |
    {"apiUrl":"https://{{.Values.host.backend}}/api"}
