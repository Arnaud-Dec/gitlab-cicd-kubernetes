stages:
  - deploy
  - cleanup

variables:
  RELEASE: ci-$CI_PIPELINE_ID
  HOST_PREFIX: decourt-demaria-ci-$CI_PIPELINE_ID
  BACKEND_TAG: latest
  FRONTEND_TAG: latest

image:
  name: alpine/helm:4.3.0
  entrypoint: [""]

deploy:
  stage: deploy
  environment:
    name: $RELEASE
    url: https://$HOST_PREFIX-frontend.k8s.granux.fr
    on_stop: cleanup
  script:
    - >
      helm install "$RELEASE" helm/                                       
      --set host.frontend=$HOST_PREFIX-frontend.k8s.granux.fr             
      --set host.backend=$HOST_PREFIX-backend.k8s.granux.fr
      --set host.swagger=$HOST_PREFIX-swagger.k8s.granux.fr
      --set frontend.imageTag=$FRONTEND_TAG
      --set backend.imageTag=$BACKEND_TAG
      --wait --timeout 5m
      

cleanup:
  stage: cleanup
  environment:
    name: $RELEASE
    action: stop
  when: always
  script:
    - helm uninstall "$RELEASE" --wait --timeout 5m --ignore-not-found