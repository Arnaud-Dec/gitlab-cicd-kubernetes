stages:
  - test
  - build
  - deploy

# Les checks sont définis dans le Dockerfile : même commande en local et en CI
default:
  image: docker:cli

test:
  stage: test
  script:
    - docker build --target test .

build-image:
  stage: build
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - IMAGE="$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    # --provenance=false : depuis Docker 29.7, l'attestation peut être poussée avant
    # l'image qu'elle référence, ce que la registry GitLab refuse ("blob unknown to registry").
    - docker build --provenance=false -t "$IMAGE" .
    - docker push "$IMAGE"
    - if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then docker tag "$IMAGE" "$CI_REGISTRY_IMAGE:latest" && docker push "$CI_REGISTRY_IMAGE:latest"; fi
    - if [ -n "$CI_COMMIT_TAG" ]; then docker tag "$IMAGE" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG" && docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"; fi

deploy:
  stage: deploy
  variables:
    FRONTEND_TAG: $CI_COMMIT_SHORT_SHA
  trigger:
    project: decourt-demaria/tp/ci-cd
    branch: main
    strategy: depend
