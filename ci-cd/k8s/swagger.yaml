apiVersion: apps/v1
kind: Deployment
metadata:
  name: swagger
spec:
  selector:
    matchLabels:
      app: swagger
  replicas: 1
  template:
    metadata:
      labels:
        app: swagger
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: swagger
          image: registry.granux.fr/decourt-demaria/tp/backend/swagger:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: 100Mi
              cpu: 100m
            limits:
              memory: 100Mi     # = request : le cours le conseille, la mémoire se partage mal
              cpu: 500m         # plus haut que la request, pour absorber le démarrage
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
---
kind: Service
apiVersion: v1
metadata:
  name: swagger
spec:
  selector:
    app: swagger
  ports:
    - port: 8080

