# Suite de tests du backend contre un vrai Postgres (README, § Test).
#   docker compose -f compose.test.yml run --rm test
#   docker compose -f compose.test.yml down -v --rmi local
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todos
    healthcheck:
      # -h 127.0.0.1 : force le TCP, sinon pg_isready répond "prêt" pendant
      # l'initialisation, quand Postgres n'écoute encore que sur son socket local
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d todos"]
      interval: 2s
      timeout: 5s
      retries: 15

  test:
    build:
      context: .
      target: test
    environment:
      TEST_DATABASE_DSN: "host=postgres port=5432 user=postgres password=postgres dbname=todos sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
